name: Build and Push Fork Docker Image

on:
  push:
    branches: ['v1.3.128-hydra-patch']
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        run: git clone --depth 1 --branch "${{ github.ref_name }}" "https://github.com/${{ github.repository }}.git" .

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE=ghcr.io/galacticcouncil/fork-patch

          docker build -t "${IMAGE}:latest" -t "${IMAGE}:sha-${SHORT_SHA}" -f ./fork/Dockerfile .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${SHORT_SHA}"
